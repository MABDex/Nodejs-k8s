name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

env:
  IMAGE_NAME: examplenode-dev

jobs:
  # -------------------------------------------------------------
  # Job 1: CI (Continuous Integration) - Build & Push
  # -------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # -------------------------------------------------------------
  # Job 2: CD (Continuous Delivery) - Wartet auf Job "ci"
  # -------------------------------------------------------------
  cd:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Image Tag in Kustomize
        run: |
          cd k8s
          kustomize edit set image ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(cd): update image tag to ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git push